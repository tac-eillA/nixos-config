force_keyboard_focus = true
selection_wrap = true
theme = "default"
hide_action_hints = true

[placeholders]
"default" = { input = "Search...", list = "No results" }

[keybinds]
quick_activate = []

[providers]
max_results = 256
default = [
  "desktopapplications",
  "websearch",
  "commands",
]

[[providers.prefixes]]
prefix = "/"
provider = "files"

[[providers.prefixes]]
prefix = ":"
provider = "clipboard"

[[providers.prefixes]]
prefix = "."
provider = "symbols"

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = ";"
provider = "providerlist"
