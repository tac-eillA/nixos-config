set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g escape-time 10
set -sg repeat-time 600

set -g status-position top
set -g status-interval 1
set -g status-justify centre
set -g status-left-length 50
set -g status-right-length 120

set -g status-style "bg=#0b1324,fg=#c9dcf8"
set -g message-style "bg=#0f203a,fg=#d9ecff"
set -g pane-border-style "fg=#24344d"
set -g pane-active-border-style "fg=#7fb9ff"

set -g status-left "#[bg=#0f203a,fg=#8ec5fc,bold] #S #[bg=#0b1324,fg=#3b4f6d] >"
set -g status-right "#[bg=#0b1324,fg=#3b4f6d] < #[bg=#0f203a,fg=#9ec9ff] %Y-%m-%d #[fg=#7bb8ff]|#[fg=#d9ecff] %H:%M #[default]"

setw -g window-status-format " #[fg=#6f88ac]#I:#W "
setw -g window-status-current-format " #[bg=#162947,fg=#e6f1ff,bold]#I:#W#[default] "
setw -g window-status-separator ""

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
